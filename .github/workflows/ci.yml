name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run build

      - run: bun run lint

      - run: bun run type-check

      # `bun run test` builds first; CI already built above, so run the
      # per-package tests directly against that build to avoid a rebuild.
      - run: bun run --filter '*' test
