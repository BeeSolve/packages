name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bunx svelte-kit sync --cwd packages/dmarc-dashboard

      - run: bun run lint

      - run: bun run build

      - run: bun run type-check
