<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DMARC Dashboard</title>
    <script>
      // Apply any stored theme override before first paint to avoid a flash.
      // Model per https://lea.verou.me/blog/2026/dark-mode-toggles/: stored
      // value is "light" | "dark" (an explicit override) or absent (follow the
      // OS via `light dark`). Graffiti themes via color-scheme + light-dark().
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var scheme = saved === "light" || saved === "dark" ? saved : "light dark";
          document.documentElement.style.setProperty("color-scheme", scheme);
        } catch (error) {
          document.documentElement.style.setProperty("color-scheme", "light dark");
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
